spring.application.name=order-management-api
spring.jpa.open-in-view=false
# SpringDoc
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
# JWT
api.security.token.secret=${JWT_SECRET:dev-insecure-key-change-in-production}
api.security.token.expiration-minutes=${JWT_EXPIRATION:30}
api.security.refresh-token.expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}
# Actuator: only health is public, everything else needs ADMIN
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never